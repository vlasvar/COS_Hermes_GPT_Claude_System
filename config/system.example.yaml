system:
  name: "My Chief of Staff"
  timezone: "Etc/UTC"
  review_day: "Friday"
  review_time: "16:00"
  onboarding: "finance_first"

stores:
  operational:
    type: "google_sheets"
    spreadsheet_id: "REPLACE_IN_PRIVATE_INSTANCE"
  evidence:
    type: "google_drive"
    folder_id: "REPLACE_IN_PRIVATE_INSTANCE"

permissions:
  workspace_role: "operator"
  default_level: 2
  maintain_internal_records: true
  process_financial_evidence: true
  create_provisional_expenses: true
  maintain_budgets: true
  send_external_communications: "approval_required"
  publish_content: "approval_required"
  spend_or_transfer_money: "approval_required"
  delete_records_or_files: "approval_required"
  change_access_permissions: "approval_required"

profile:
  identity_required: false

agent:
  adapter: "generic" # generic | hermes | chatgpt | claude | gemini
  log_material_operations: true
  verify_external_writes: true
  stop_when_connector_is_read_only: true
